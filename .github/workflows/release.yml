name: release-desktop

# 태그 push(v*) 또는 수동 dispatch:
#  - e2e: 리눅스에서 전체 E2E 스위트
#  - desktop: 3-OS 인스톨러 빌드 → GitHub Release 업로드
#  - ghcr: 컨테이너 이미지 → ghcr.io/hanmariyang/coxpit
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # 멈추면 6h 대신 20분에 fail-fast (재실행 가능)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # apt 미러 stall 방어: 시도마다 자체 timeout + 재시도 (apt 는 hung 커넥션에 자체 타임아웃이 없다)
      - name: install tmux
        run: |
          for i in 1 2 3; do
            sudo timeout 150 apt-get update \
              && sudo timeout 150 apt-get install -y --no-install-recommends tmux \
              && break
            echo "::warning::apt attempt $i stalled/failed — retrying in 5s"; sleep 5
          done
          tmux -V     # 설치 실패 시 여기서 스텝을 fail 시킨다
      - run: npm ci
      - run: npm run typecheck
      - run: bash test/e2e.sh

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # dmg (arm64 + x64)
          - os: windows-latest    # nsis exe
          - os: ubuntu-latest     # AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30          # 서명·notarize 여유 (macOS 실측 ~7분)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # 데몬 프로덕션 의존성 (플랫폼별 네이티브 프리빌드 포함) — 앱에 번들됨
      - run: npm ci --omit=dev

      # 데스크톱 셸 빌드 + Release 업로드
      - run: npm ci
        working-directory: desktop
      # 서명 시크릿은 macOS 에서만 사용 — 다른 OS 는 Apple p12 로 서명을 시도하다 깨진다.
      # 미설정 시크릿도 빈 문자열로 주입되므로 함께 unset(=unsigned 빌드).
      - run: |
          if [ "$RUNNER_OS" != "macOS" ] || [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder --publish always
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # 모든 인스톨러가 draft 릴리스에 다 오른 뒤에야 공개 — 업데이터가 yml 없는
  # 최신 릴리스를 보는 "타이밍 404 창"을 없앤다.
  # e2e 도 gate: 인스톨러는 병렬로 다 빌드하되, 공개(un-draft)는 e2e 통과 시에만.
  # e2e 가 인프라 플레이크로 실패하면 릴리스는 draft 로 남고, e2e 재실행 시 이 잡이 이어서 공개한다.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: publish the draft release
        run: gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve version tag
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hanmariyang/coxpit:latest
            ghcr.io/hanmariyang/coxpit:${{ steps.v.outputs.version }}
