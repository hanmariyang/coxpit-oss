name: release-desktop

# 태그 push(v*) 또는 수동 dispatch:
#  - e2e: 리눅스에서 전체 E2E 스위트
#  - desktop: 3-OS 인스톨러 빌드 → GitHub Release 업로드
#  - ghcr: 컨테이너 이미지 → ghcr.io/hanmariyang/coxpit
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # 멈추면 6h 대신 20분에 fail-fast (재실행 가능)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # ⛔ 캐시를 빼지 말 것. macOS 러너는 1분이 10분으로 차감되는데
          #    이 잡은 npm ci 를 두 번(루트 + desktop/) 돈다. 2026-09 실측:
          #    캐시 없이 macOS npm ci 에만 월 26분 = 환산 260분(약 $4)이 나갔다.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # apt 미러 stall 방어: 시도마다 자체 timeout + 재시도 (apt 는 hung 커넥션에 자체 타임아웃이 없다)
      - name: install tmux
        run: |
          for i in 1 2 3; do
            sudo timeout 150 apt-get update \
              && sudo timeout 150 apt-get install -y --no-install-recommends tmux \
              && break
            echo "::warning::apt attempt $i stalled/failed — retrying in 5s"; sleep 5
          done
          tmux -V     # 설치 실패 시 여기서 스텝을 fail 시킨다
      - run: npm ci
      - run: npm run typecheck
      - run: bash test/e2e.sh

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # dmg (arm64 + x64)
          - os: windows-latest    # nsis exe
          - os: ubuntu-latest     # AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30          # 서명·notarize 여유 (macOS 실측 ~7분)
    env:
      # 시크릿 노출 없이 "서명 자산이 있나"만 문자열로. 아래 스텝 if 게이트에 쓴다.
      HAS_MAC_SIGN: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # ⛔ 캐시를 빼지 말 것. macOS 러너는 1분이 10분으로 차감되는데
          #    이 잡은 npm ci 를 두 번(루트 + desktop/) 돈다. 2026-09 실측:
          #    캐시 없이 macOS npm ci 에만 월 26분 = 환산 260분(약 $4)이 나갔다.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # 데몬 프로덕션 의존성 (플랫폼별 네이티브 프리빌드 포함) — 앱에 번들됨
      - run: npm ci --omit=dev

      # 데스크톱 셸 빌드 + Release 업로드
      - run: npm ci
        working-directory: desktop

      # macOS 서명: electron-builder 내장 p12 임포트는 `security set-key-partition-list`
      # 에서 SecKeychainUnlock 로 깨지는 알려진 버그가 있다(로컬선 p12 가 열려도). 표준 해법 —
      # 인증서를 이 액션으로 먼저 키체인에 넣고, electron-builder 는 AUTO_DISCOVERY 로 그 신원을 쓴다.
      - name: Import Developer ID certificate (signed macOS build)
        if: ${{ matrix.os == 'macos-latest' && env.HAS_MAC_SIGN == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      # 서명: mac + 서명자산 있으면 키체인 신원으로 서명+공증. 아니면 unsigned(notarize=false 명시).
      - run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_MAC_SIGN" = "true" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true   # 위 스텝이 넣은 키체인 신원 사용
            npx electron-builder --publish always
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --publish always -c.mac.notarize=false
          fi
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_MAC_SIGN: ${{ env.HAS_MAC_SIGN }}
          # CSC_LINK/CSC_KEY_PASSWORD 는 일부러 안 넘긴다 — 임포트 스텝이 이미 키체인에 넣었고,
          # electron-builder 에 다시 주면 그 깨지는 내장 임포트를 또 탄다.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # pty master fd 누수 회귀(issue #9) — darwin 전용이라 리눅스 e2e 로는 못 잡는다.
  # spawnPty 래퍼가 regress 하면 (또는 node-pty 가 다시 새면) 여기서 fail → 릴리스 차단.
  pty-fd-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # ⛔ 캐시를 빼지 말 것. macOS 러너는 1분이 10분으로 차감되는데
          #    이 잡은 npm ci 를 두 번(루트 + desktop/) 돈다. 2026-09 실측:
          #    캐시 없이 macOS npm ci 에만 월 26분 = 환산 260분(약 $4)이 나갔다.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: node --import tsx test/pty-fd.mjs

  # 모든 인스톨러가 draft 릴리스에 다 오른 뒤에야 공개 — 업데이터가 yml 없는
  # 최신 릴리스를 보는 "타이밍 404 창"을 없앤다.
  # e2e 도 gate: 인스톨러는 병렬로 다 빌드하되, 공개(un-draft)는 e2e·pty-fd 통과 시에만.
  # e2e 가 인프라 플레이크로 실패하면 릴리스는 draft 로 남고, 재실행 시 이 잡이 이어서 공개한다.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, e2e, pty-fd-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: publish the draft release
        run: gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve version tag
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hanmariyang/coxpit:latest
            ghcr.io/hanmariyang/coxpit:${{ steps.v.outputs.version }}

      # ⛔ 이 스텝을 빼지 말 것. GHCR 은 옛 버전을 절대 자동 삭제하지 않는다.
      #    2026-09 실측: 릴리스 86회가 쌓여 5.73GB — 포함 저장공간 2GB 의 286%.
      #    한도를 넘으면 초과분이 과금되고, 예산 정지가 걸리면 그 계정의
      #    아티팩트 업로드까지 "Artifact storage quota has been hit" 으로 막힌다
      #    (에러 문구가 엉뚱한 곳을 가리키니 원인 추적이 오래 걸린다).
      - name: 옛 이미지 버전 정리 — 최근 10벌만 남긴다
        uses: actions/delete-package-versions@v5
        with:
          package-name: coxpit
          package-type: container
          min-versions-to-keep: 10
          # :latest 가 가리키는 버전은 지우지 않는다(태그 없는 중간 산출물만 먼저 정리)
          delete-only-untagged-versions: false
