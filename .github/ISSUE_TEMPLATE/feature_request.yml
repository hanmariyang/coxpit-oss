name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Coxpit stays small and owner-first on purpose. Please skim the
        [non-goals](https://github.com/hanmariyang/coxpit-oss/blob/main/ROADMAP.md#non-goals)
        first — accounts, telemetry, a cloud relay, and a board bundler are out of scope by design.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: The workflow or pain point behind the request — the "why", not just the "what".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Coxpit to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, existing workarounds, or how other tools handle this.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I've read the non-goals and believe this fits Coxpit's owner-first, single-daemon shape.
          required: true
